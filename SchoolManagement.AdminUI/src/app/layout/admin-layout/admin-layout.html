
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">🏫</span>
      <span>School Management</span>
    </div>

    <div *ngIf="loading" class="sidebar-message">
      Loading navigation...
    </div>

    <div *ngIf="errorMessage" class="sidebar-error">
      {{ errorMessage }}
      <button type="button" (click)="loadMenus()">
        Retry
      </button>
    </div>

    <nav *ngIf="!loading && !errorMessage" class="sidebar-nav">
      <ng-container
        *ngFor="let menu of menus; trackBy: trackByMenuId">

        <!-- Parent menu -->
        <div *ngIf="menu.childMenus?.length" class="menu-group">
          <button
            type="button"
            class="menu-link parent-link"
            (click)="toggleMenu(menu.navigationMenuId)"
            [attr.aria-expanded]="isExpanded(menu.navigationMenuId)">

            <span class="menu-icon">
              {{ menu.icon || 'folder' }}
            </span>

            <span class="menu-title">{{ menu.title }}</span>

            <span class="menu-arrow">
              {{ isExpanded(menu.navigationMenuId) ? '−' : '+' }}
            </span>
          </button>

          <div
            class="submenu"
            *ngIf="isExpanded(menu.navigationMenuId)">

            <a
              *ngFor="let child of menu.childMenus; trackBy: trackByMenuId"
              class="menu-link child-link"
              [routerLink]="child.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              [attr.aria-disabled]="!child.route">

              <span class="menu-icon">
                {{ child.icon || 'circle' }}
              </span>

              <span class="menu-title">{{ child.title }}</span>
            </a>
          </div>
        </div>

        <!-- Menu without children -->
        <a
          *ngIf="!menu.childMenus?.length && menu.route"
          class="menu-link"
          [routerLink]="menu.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">

          <span class="menu-icon">
            {{ menu.icon || 'circle' }}
          </span>

          <span class="menu-title">{{ menu.title }}</span>
        </a>

      </ng-container>
    </nav>
    <div class="sidebar-footer">
  <button
    type="button"
    class="logout-button"
    (click)="logout()">

    <span class="logout-icon">↪</span>
    <span>Logout</span>
  </button>
</div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
