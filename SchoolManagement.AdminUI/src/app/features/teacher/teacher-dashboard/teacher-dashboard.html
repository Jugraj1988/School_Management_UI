<div class="container-fluid p-3 p-md-4">

  <!-- Page Header -->
  <div class="mb-4">
    <h2 class="fw-bold mb-1">Teacher Dashboard</h2>
    <p class="text-muted mb-0">
      Welcome back! Manage your students and attendance from here.
    </p>
  </div>

  <!-- Summary Cards -->
  <div class="row g-3 mb-4">

    <!-- Students -->
    <div class="col-12 col-sm-6 col-xl-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center">

          <div class="bg-primary-subtle text-primary rounded-3 p-3">
            <i class="fas fa-user-graduate fs-4"></i>
          </div>

          <div class="ms-3">
            <p class="text-muted mb-1 small">Total Students</p>
            <h3 class="fw-bold mb-0">—</h3>
          </div>

        </div>
      </div>
    </div>

    <!-- Classes -->
    <div class="col-12 col-sm-6 col-xl-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center">

          <div class="bg-success-subtle text-success rounded-3 p-3">
            <i class="fas fa-chalkboard fs-4"></i>
          </div>

          <div class="ms-3">
            <p class="text-muted mb-1 small">Total Classes</p>
            <h3 class="fw-bold mb-0">—</h3>
          </div>

        </div>
      </div>
    </div>

    <!-- Today's Attendance -->
    <div class="col-12 col-sm-6 col-xl-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center">

          <div class="bg-warning-subtle text-warning rounded-3 p-3">
            <i class="fas fa-calendar-check fs-4"></i>
          </div>

          <div class="ms-3">
            <p class="text-muted mb-1 small">Today's Attendance</p>
            <h3 class="fw-bold mb-0">—</h3>
          </div>

        </div>
      </div>
    </div>

  </div>

  <!-- Quick Actions -->
  <div class="card border-0 shadow-sm">

    <div class="card-header bg-white py-3">
      <h5 class="fw-bold mb-1">Quick Actions</h5>
      <p class="text-muted small mb-0">
        Frequently used teacher actions.
      </p>
    </div>

    <div class="card-body">
      <div class="row g-3">

        <!-- Mark Attendance -->
        <div class="col-12 col-md-6">
          <button
            type="button"
            class="btn btn-outline-primary w-100 py-3">

            <i class="fas fa-calendar-check fs-5 me-2"></i>
            <span class="fw-semibold">Mark Attendance</span>

          </button>
        </div>

        <!-- View Students -->
        <div class="col-12 col-md-6">
          <button
            type="button"
            class="btn btn-outline-success w-100 py-3">

            <i class="fas fa-user-graduate fs-5 me-2"></i>
            <span class="fw-semibold">View Students</span>

          </button>
        </div>

      </div>
    </div>

  </div>

</div>
